
Title = "Combined Dataset Maker 20/10"
# This is the configuration file for creating a mixed source dataset from 6 different sources:

# Total number of samples to include in the combined dataset
# if set to MAX, it uses all available samples from enabled sources
total_samples = 1720

# if true, saves the combined dataset in Apache Arrow format for efficiency, otherwise saves as csv
use_arrow = false

# if true, uses a random seed for sampling and shuffling, otherwise uses fixed seed 0
random = false

# if true, balances each source to have equal numbers of human (0) and AI (1) generated texts (does not handle case where this limits the numbe of samples contributed by a source for now, so one mmight end up with less than total_samples in the combined dataset)
balance_classes = true

# if relaive_portion is not set, it defaults to equal distribution among enabled sources (16.67% each for 6 sources)
# set relative portion to "0.2" for 20% of the total samples from that source
# if using relative portion, ensure the sum of all relative portions equals 1.0

# Perplexity processing configuration
[perplexity]
# Model to use for perplexity calculation
model = "EleutherAI/pythia-1.4b"
# Maximum sequence length for perplexity calculation
max_len = 1536
# Stride for sliding window (use same as max_len to avoid overlap)
stride = 1536
# Batch size for processing (not implemented yet, so leave at 1, think batch processing requires multi-gpu or running
# multiple modelels with seperate dataloaders in parallel?)
batch_size = 1
# Resume processing if interrupted (skip existing outputs)
resume = true


[ai_text_detection_pile]
enabled = false
# NOTE: THIS DOES NOT HAVE PRECOMPUTED PERPLEXITYS AS OF 20/10
relative_portion = 0


[hc3]
sources_to_include = [
    'reddit_eli5',
    'open_qa',
    'wiki_csai',
    'finance',
    'medicine',
]
enabled = true
relative_portion = 0


[daigt_v2]
enabled = true
relative_portion = 0


[sunilthite]
enabled = true
relative_portion = 0


[ah_aitd]
enabled = true
relative_portion = 0

[llm_detect_competition]
enabled = false
relative_portion = 0

[evobench]
enabled = true
# Model families to include from EvoBench dataset
model_families = [
    'GPT4',
    'GPT4o',
    'Claude',
    'Gemini',
    'LlaMA-2-7B',
    'LlaMA3',
    'Qwen',
]
# Domains to include from EvoBench dataset
domains_to_include = ['xsum', 'writing', 'pubmed', 'peerread', 'harmful']
relative_portion = 0

# Cross-dataset evaluation configuration
[cross_dataset_evaluation]
# Maximum number of samples for training datasets (per experiment)
max_training_samples = 40000
# Maximum number of samples for test datasets (per experiment)
max_test_samples = 10000
# Whether to ensure equal representation from each training dataset
ensure_equal_representation = true
# Always include these datasets in training (never excluded)
always_include_training = ['hc3', 'evobench']
